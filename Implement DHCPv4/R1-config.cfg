enable
configure terminal
hostname R1
ip domain name ccna-lab.com
no ip domain-lookup
security password min-length 12
username SSHadmin secret class12345678
enable secret class12345678
service password-encryption

banner motd #unauthorized access is prohibited#

ip ssh version 2
crypto key generate rsa modulus 2048
 ip ssh time-out 60 
 ip ssh authentication-retries 2 

ipv6 unicast-routing

interface GigabitEthernet0/0
 ip address 192.168.0.1 255.255.255.0
 ipv6 enable
 ipv6 address 2001:db8:acad::1/64
 no shutdown
exit

interface GigabitEthernet0/1
 description g0/1 to F0/5 in S1
 no ip address
 no shutdown
exit

interface GigabitEthernet 0/1.1000
 description Native VLAN
 encapsulation dot1Q 1000 native
 no shutdown
 exit

interface GigabitEthernet 0/1.10
 description VLAN 10 Data
 ip address 192.168.10.1 255.255.255.0
 encapsulation dot1Q 10
 no shutdown
 exit

interface GigabitEthernet 0/1.20
 description VLAN 20 Data
 ip address 192.168.20.1 255.255.255.0
 encapsulation dot1Q 20
 no shutdown
 exit

interface GigabitEthernet 0/1.30
 description VLAN 30 Data
 ip address 192.168.30.1 255.255.255.0
 encapsulation dot1Q 30
 no shutdown
 exit
 
login block-for 120 attempts 3 within 60

line con 0
 password class12345678
 login
 exit

line vty 0 4
 transport input ssh
 login local
 exit

end

clock set 12:20:45 18 August 2026
configure terminal
clock timezone CET 1
exit

write memory