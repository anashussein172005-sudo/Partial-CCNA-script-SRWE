enable
configure terminal
hostname R2
no ip domain-lookup
enable secret class12345678
line console 0
 password class12345678
 login
 exit
line vty 0 4
 password class12345678
 login
 exit
service password-encryption
banner motd #Unauthorized access is prohibited!#

interface g0/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
 exit

interface g0/1
 description Subnet C - Client Network
 ip address 192.168.1.97 255.255.255.240
 ip helper-address 10.0.0.1
 no shutdown
 exit

ip route 0.0.0.0 0.0.0.0 10.0.0.1
 end
copy running-config startup-config