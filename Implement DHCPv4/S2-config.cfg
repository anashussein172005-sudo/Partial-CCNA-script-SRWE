enable
configure terminal
hostname S2
ip domain name ccna-lab.com
no ip domain-lookup
security password min-length 12
username SSHadmin secret 55Hadm!n2020
enable secret class12345678
service password-encryption
ip default-gateway 192.168.10.1

banner motd #unauthorized access is prohibited#

crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ipv6 unicast-routing

vlan 10
 name Management 
vlan 20
 name Clients
vlan 30
 name Operations
vlan 999
 name ParkingLot
vlan 1000
 name Native

interface vlan 10
 ip address 192.168.10.12 255.255.255.0
 no shutdown
 exit

interface vlan 20
 ip address 192.168.20.12 255.255.255.0
 no shutdown
 exit

interface vlan 30
 ip address 192.168.30.13 255.255.255.0
 no shutdown
 exit

interface vlan 999
 shutdown
 exit

interface range FastEthernet 0/1 - 2
 channel-group 1 mode active
 no shutdown
 exit

interface FastEthernet 0/18
 switchport mode access
 switchport access vlan 20
 exit

interface range FastEthernet 0/3 - 17
 switchport mode access
 switchport access vlan 999
 exit
interface range FastEthernet 0/19 - 24
 switchport mode access
 switchport access vlan 999
 exit
interface GigabitEthernet 0/1
 switchport mode access
 switchport access vlan 999
 exit

login block-for 120 attempts 3 within 60

line con 0
 password class12345678
 login
 logging synchronous
 exit

line vty 0 4
 login local
 transport input ssh
 exit

clock timezone CET 1 0
exit

clock set 12:20:45 18 August 2026
copy running-config startup-config